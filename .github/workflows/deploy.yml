name: Deploy to Snowflake

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
  SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
  CORTEX_ANALYST_TOKEN: ${{ secrets.CORTEX_ANALYST_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=src --cov-report=xml || true

    - name: Test Cortex Analyst connection
      run: |
        python test_cortex_api.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Snowflake CLI
      run: |
        pip install snowflake-cli-labs

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create deployment package
      run: |
        mkdir -p dist/src
        cp streamlit_app.py dist/
        cp requirements.txt dist/
        cp -r src/* dist/src/
        ls -la dist/

    - name: Upload to Snowflake Stage
      run: |
        python scripts/deploy.py
      env:
        DEPLOY_ENV: prod

    - name: Deploy Streamlit App
      run: |
        python scripts/create_streamlit_app.py
      env:
        APP_NAME: census_chat_prod
        WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}

    - name: Run Smoke Tests
      run: |
        python scripts/smoke_test.py
      env:
        APP_ENV: prod

    - name: Notify Deployment Success
      if: success()
      run: |
        echo "✓ App deployed successfully to Snowflake"
        echo "✓ Access at: Snowflake Console → Streamlit → census_chat_prod"

    - name: Notify Deployment Failure
      if: failure()
      run: |
        echo "✗ Deployment failed. Check logs above."
        exit 1
