name: Deploy to Snowflake

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
  SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
  CORTEX_ANALYST_TOKEN: ${{ secrets.CORTEX_ANALYST_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=src --cov-report=xml || true

    - name: Test Cortex Analyst connection
      run: |
        python test_cortex_api.py

  deploy-sql:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Deploy Curated Layer
      run: |
        python scripts/deploy_curated.py
      env:
        SNOWFLAKE_ACCOUNT: ${{ env.SNOWFLAKE_ACCOUNT }}
        SNOWFLAKE_USER: ${{ env.SNOWFLAKE_USER }}
        SNOWFLAKE_PASSWORD: ${{ env.SNOWFLAKE_PASSWORD }}
        SNOWFLAKE_DATABASE: ${{ env.SNOWFLAKE_DATABASE }}
        SNOWFLAKE_SCHEMA: ${{ env.SNOWFLAKE_SCHEMA }}
        SNOWFLAKE_WAREHOUSE: ${{ env.SNOWFLAKE_WAREHOUSE }}

    - name: Deploy Semantic Layer
      run: |
        python scripts/deploy_semantic.py
      env:
        SNOWFLAKE_ACCOUNT: ${{ env.SNOWFLAKE_ACCOUNT }}
        SNOWFLAKE_USER: ${{ env.SNOWFLAKE_USER }}
        SNOWFLAKE_PASSWORD: ${{ env.SNOWFLAKE_PASSWORD }}
        SNOWFLAKE_DATABASE: ${{ env.SNOWFLAKE_DATABASE }}
        SNOWFLAKE_SCHEMA: ${{ env.SNOWFLAKE_SCHEMA }}
        SNOWFLAKE_WAREHOUSE: ${{ env.SNOWFLAKE_WAREHOUSE }}

  notify:
    needs: deploy-sql
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Notify Success
      if: success()
      run: |
        echo "✓ SQL layers deployed successfully"
        echo "✓ Streamlit Cloud auto-deploying from GitHub"

    - name: Notify Failure
      if: failure()
      run: |
        echo "✗ SQL deployment failed"
        exit 1
