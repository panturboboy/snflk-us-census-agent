[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (require Snowflake connection)
    e2e: End-to-end tests (full application flow)
    slow: Slow tests (network calls, API calls)
